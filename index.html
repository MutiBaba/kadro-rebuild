<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebuild11 — Kadro Rebuild</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="bg-grid"></div>
  <span class="floaty f1">⚽</span>
  <span class="floaty f2">⚽</span>
  <span class="floaty f3">⭐</span>
  <span class="floaty f4">⭐</span>
</div>

<!-- LANGUAGE SWITCHER (landing / setup / lobby ekranlarında sağ üstte) -->
<div class="lang-switcher" id="langSwitcher">
  <button id="langBtn" class="lang-btn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="lang-globe">🌐</span><span id="langBtnFlag">🇹🇷</span>
  </button>
  <div class="lang-menu hidden" id="langMenu" role="menu"></div>
</div>

<!-- LANDING / MODE SELECT SCREEN -->
<section id="landingScreen" class="screen">
  <div class="setup-card">
    <div class="brand-logo">
      <div class="brand-badge">
        <span class="brand-ball">⚽</span>
        <span class="brand-num">11</span>
      </div>
      <div class="brand-word">Rebuild<span class="brand-word-accent">11</span></div>
      <div class="brand-tagline" data-i18n="brand.tagline">KADRO REBUILD · 5 BÜYÜK LİG</div>
    </div>
    <p class="subtitle" data-i18n-html="landing.subtitle"></p>
    <button id="modeBotBtn" class="primary-btn" data-i18n="landing.playBots">🤖 Botlara Karşı Oyna</button>
    <button id="modeLobbyBtn" class="primary-btn secondary-btn-style" data-i18n="landing.playFriends">👥 Arkadaşlarla Oyna</button>
  </div>
</section>

<!-- SETUP SCREEN (bot mode) -->
<section id="setupScreen" class="screen hidden">
  <div class="setup-card">
    <button class="back-link" data-back-to="landingScreen" data-i18n="common.back">◀ Geri</button>
    <div class="setup-hero">
      <div class="hero-trophy">🏆</div>
    </div>
    <h1><span data-i18n="setup.title">Kadro Rebuild</span> <span class="accent" id="setupTeamName">Fennerbahce</span></h1>
    <p class="subtitle" id="setupSubtitle"></p>

    <div class="setup-row">
      <label data-i18n="setup.leagueLabel">Ligini Seç</label>
      <div class="team-pick-grid league-pick-grid" id="leaguePickGroup"></div>
      <p class="hint" id="leaguePickHint"></p>
    </div>

    <div class="setup-row">
      <label><span data-i18n="setup.teamLabel">Takımını Seç</span> <span class="hint-inline" id="teamPickLabelHint"></span></label>
      <div class="team-pick-grid" id="botTeamPickGroup"></div>
    </div>

    <div class="setup-row">
      <label id="opponentPickLabel">Rakiplerini Seç</label>
      <div class="team-pick-grid" id="opponentPickGrid"></div>
      <p class="hint" id="opponentPickHint"></p>
    </div>

    <div class="setup-row">
      <label data-i18n="setup.modeLabel">Oyun Modu</label>
      <div class="option-group" id="botModePickGroup">
        <button class="option-btn active" data-mode="rebuild" data-i18n="setup.modeRebuild">🔁 Kadro Rebuild</button>
        <button class="option-btn" data-mode="empty" data-i18n="setup.modeEmpty">🌱 Sıfırdan Kadro Kur</button>
      </div>
      <p class="hint" id="botModeHint"></p>
    </div>

    <div class="setup-row">
      <label data-i18n="setup.draftLabel">Draft Modu</label>
      <div class="option-group" id="botDraftModeGroup">
        <button class="option-btn active" data-draft="off" data-i18n="setup.draftOff">Kapalı</button>
        <button class="option-btn" data-draft="on" data-i18n="setup.draftOn">🎯 Draft Modu Açık</button>
      </div>
      <p class="hint" id="botDraftModeHint" data-i18n="setup.draftHint"></p>
    </div>

    <div class="setup-row">
      <label data-i18n="setup.seasonsLabel">Kariyer Uzunluğu</label>
      <div class="option-group wrap-group" id="botSeasonCountGroup">
        <button class="option-btn active" data-seasons="5">5</button>
        <button class="option-btn" data-seasons="10">10</button>
        <button class="option-btn" data-seasons="15">15</button>
        <button class="option-btn" data-seasons="20">20</button>
        <button class="option-btn" data-seasons="25">25</button>
        <button class="option-btn" data-seasons="30">30</button>
      </div>
    </div>

    <div class="setup-row">
      <label data-i18n="setup.budgetPickLabel">Başlangıç Bütçesi</label>
      <div class="option-group wrap-group" id="botBudgetGroup">
        <button class="option-btn" data-budget="0.5" data-i18n="setup.budgetLow">Düşük</button>
        <button class="option-btn active" data-budget="1" data-i18n="setup.budgetNormal">Normal</button>
        <button class="option-btn" data-budget="1.5" data-i18n="setup.budgetHigh">Yüksek</button>
        <button class="option-btn" data-budget="2" data-i18n="setup.budgetVeryHigh">Çok Yüksek</button>
        <button class="option-btn" data-budget="3" data-i18n="setup.budgetHuge">Devasa</button>
      </div>
    </div>

    <div class="setup-row hidden" id="teamNameRow">
      <label data-i18n="setup.teamNameLabel">Takımının İsmi</label>
      <input type="text" id="teamNameInput" class="lobby-input" data-i18n-placeholder="setup.teamNamePlaceholder" maxlength="24">
    </div>

    <div class="budget-display">
      <span class="budget-label" data-i18n="setup.budgetLabel">Herkesin Bütçesi</span>
      <span class="budget-amount" id="setupBudgetAmount">€120,0M</span>
    </div>

    <div class="opponents-row" id="setupOpponentsRow"></div>

    <button id="startBtn" class="primary-btn">Rebuild'e Başla</button>
  </div>
</section>

<!-- LOBBY SCREEN (multiplayer) -->
<section id="lobbyScreen" class="screen hidden">
  <div class="setup-card">
    <button class="back-link" data-back-to="landingScreen" data-i18n="common.back">◀ Geri</button>
    <div class="setup-hero">
      <div class="hero-trophy">👥</div>
    </div>
    <div id="lobbyContent"></div>
  </div>
</section>

<!-- REBUILD SCREEN -->
<section id="rebuildScreen" class="screen hidden">
  <header class="draft-header">
    <div class="draft-title"><span data-i18n="rebuild.title">Kadro Rebuild</span> <span class="accent" id="draftTitleTeams"></span></div>
    <div class="budget-pill" id="budgetPill"></div>
  </header>

  <div id="roundLog" class="round-log hidden"></div>

  <div class="mobile-ratings-strip" id="mobileRatingsStrip"></div>

  <div class="rebuild-body">
    <aside class="squad-panel" id="squadPanel">
      <div class="squad-panel-header">
        <h3><span data-i18n="squad.yourSquad">Kadron</span> <span class="formation-tag">4-2-3-1</span></h3>
        <span class="my-avg-rating" id="myAvgRating"></span>
      </div>
      <div class="squad-panel-body" id="squadPanelBody">
        <div class="pitch" id="pitch"></div>
        <div class="bot-status-list" id="botStatusList"></div>
      </div>
    </aside>

    <main class="decision-panel">
      <div class="progress-line" id="progressLine"></div>

      <!-- Decide: keep or sell -->
      <div id="decideView" class="decide-view">
        <p class="slot-label" id="slotLabel"></p>
        <div class="current-player-card" id="currentPlayerCard"></div>
        <div class="decision-buttons">
          <button id="keepBtn" class="keep-btn" data-i18n="decide.keep">✅ Tut</button>
          <button id="sellBtn" class="sell-btn" data-i18n="decide.sell">💰 Sat</button>
        </div>
      </div>

      <!-- Choose replacement -->
      <div id="chooseView" class="choose-view hidden">
        <p class="sell-banner" id="sellBanner"></p>
        <div class="candidate-grid" id="candidateGrid"></div>
      </div>

      <!-- Auction -->
      <div id="auctionView" class="auction-view hidden">
        <p class="auction-title" data-i18n="auction.heading">🔨 Açık Artırma!</p>
        <p class="auction-desc" id="auctionDesc"></p>
        <div class="auction-candidate" id="auctionCandidate"></div>
        <div class="auction-bidders" id="auctionBidders"></div>
        <div class="auction-current-bid">
          <span data-i18n="auction.currentBid">Güncel Teklif:</span> <span id="auctionCurrentBid"></span>
        </div>
        <p class="auction-budget-hint" id="auctionBudgetHint"></p>
        <div class="auction-buttons">
          <button id="raiseBidBtn" class="keep-btn"></button>
          <button id="concedeBidBtn" class="sell-btn" data-i18n="auction.concede">🏳️ Vazgeç</button>
        </div>
      </div>
    </main>
  </div>
</section>

<!-- SEASON TABLE SCREEN -->
<section id="seasonTableScreen" class="screen hidden">
  <header class="draft-header">
    <div class="draft-title" id="seasonTableTitle"></div>
  </header>
  <div class="table-body">
    <div class="table-scroll">
      <table class="league-table" id="leagueTable">
        <thead>
          <tr>
            <th data-i18n="table.colRank">#</th>
            <th data-i18n="table.colTeam">Takım</th>
            <th><span class="full" data-i18n="table.colSquadFull">Kadro</span><span class="short" data-i18n="table.colSquadShort">KR</span></th>
            <th data-i18n="table.colPlayed">O</th>
            <th data-i18n="table.colWon">G</th>
            <th data-i18n="table.colDrawn">B</th>
            <th data-i18n="table.colLost">M</th>
            <th data-i18n="table.colGf">AG</th>
            <th data-i18n="table.colGa">YG</th>
            <th data-i18n="table.colGd">AV</th>
            <th><span class="full" data-i18n="table.colPointsFull">Puan</span><span class="short" data-i18n="table.colPointsShort">P</span></th>
            <th><span class="full" data-i18n="table.colPrizeFull">Ödül</span><span class="short">🏆</span></th>
          </tr>
        </thead>
        <tbody id="leagueTableBody"></tbody>
      </table>
    </div>

    <h3 class="scorer-title" data-i18n="table.topScorers">⚽ Gol Krallığı</h3>
    <div class="scorer-list" id="scorerList"></div>

    <button id="seasonTableContinueBtn" class="primary-btn"></button>
  </div>
</section>

<!-- DRAFT MODE SCREEN -->
<section id="draftScreen" class="screen hidden">
  <header class="draft-header">
    <div class="draft-title" id="draftScreenTitle"></div>
    <div class="budget-pill" id="draftBudgetPill"></div>
  </header>
  <div class="draft-mode-body">
    <div class="draft-slots-row" id="draftSlotsRow"></div>

    <div id="draftPickPanel" class="draft-pick-panel">
      <p class="draft-stage-title" id="draftStageTitle"></p>
      <div class="draft-pool-grid" id="draftPoolGrid"></div>
      <div class="draft-turn-row" id="draftTurnRow"></div>
      <p class="draft-hint" id="draftTurnHint"></p>
      <div class="draft-buttons">
        <button id="draftPassBtn" class="sell-btn" data-i18n="draft.pass">🏳️ Sıranı Pas Geç</button>
      </div>
    </div>

    <div id="draftSellPanel" class="draft-sell-panel hidden">
      <p class="draft-stage-title" id="draftSellTitle"></p>
      <p class="draft-hint" id="draftSellHint"></p>
      <div class="draft-sell-grid" id="draftSellGrid"></div>
      <div class="draft-buttons">
        <button id="draftSellConfirmBtn" class="primary-btn"></button>
      </div>
    </div>

    <div id="draftReplacePanel" class="draft-replace-panel hidden">
      <p class="draft-stage-title" id="draftReplaceTitle"></p>
      <p class="draft-hint" id="draftReplaceHint"></p>
      <div class="draft-replace-grid" id="draftReplaceGrid"></div>
    </div>

    <div id="draftLog" class="round-log draft-log"></div>
  </div>
</section>

<!-- TRANSFER WINDOW SCREEN -->
<section id="transferScreen" class="screen hidden">
  <header class="draft-header">
    <div class="draft-title" id="transferScreenTitle"></div>
  </header>
  <div class="transfer-body">
    <p class="transfer-intro" id="transferIntro"></p>
    <div class="transfer-offers-scroll">
      <div id="academyOfferWrap"></div>
      <div id="transferOffers" class="transfer-offers"></div>
    </div>
    <div id="botTransferSummary" class="bot-transfer-summary"></div>
    <div id="botTransferLog" class="round-log"></div>
    <div id="transferContinueRow" class="transfer-continue-row hidden">
      <button id="continueSeasonBtn" class="primary-btn" data-i18n="transfer.continue">Sonraki Sezona Geç</button>
      <button id="endCareerBtn" class="cancel-btn"></button>
    </div>
  </div>
</section>

<!-- RESULT SCREEN -->
<section id="resultScreen" class="screen hidden">
  <header class="draft-header">
    <div class="draft-title" id="resultTitle" data-i18n="result.title">Rebuild Tamamlandı</div>
  </header>
  <div class="career-summary" id="careerSummary"></div>
  <div class="result-tabs" id="resultTabs"></div>
  <div class="result-body" id="resultBody"></div>
  <button id="restartBtn" class="primary-btn" data-i18n="result.restart">Yeniden Başla</button>
</section>

<script src="data/i18n.js"></script>
<script src="data/players.js"></script>
<script src="data/players_premierleague.js"></script>
<script src="data/players_laliga.js"></script>
<script src="data/players_bundesliga.js"></script>
<script src="data/players_ligue1.js"></script>
<script src="data/name_aliases.js"></script>
<!-- data/worldmarket.js (kurgusal oyuncular) artık KULLANILMIYOR: transfer adayları
     oynanan lig dışındaki 4 ligin GERÇEK oyuncularından geliyor (bkz. crossLeaguePlayerPool).
     Dosya, doğrulama tamamlanana kadar repoda duruyor ama yüklenmiyor. -->
<script src="pixelavatar.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="game.js"></script>
<script src="multiplayer.js"></script>
<script src="langswitcher.js"></script>
</body>
</html>
